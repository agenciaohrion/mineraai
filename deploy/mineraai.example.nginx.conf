# /etc/nginx/sites-available/mineraai
# Depois: ln -s /etc/nginx/sites-available/mineraai /etc/nginx/sites-enabled/
# e certbot --nginx -d seu-dominio.com.br
server {
    listen 80;
    server_name seu-dominio.com.br;   # ou o IP da Contabo

    client_max_body_size 50m;         # uploads de vídeo/jobs maiores

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # buscas com coleta podem demorar
    }
}
